<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>devdeck</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #1e1f24; --panel: #26272e; --border: #3a3b44;
    --text: #e4e4e8; --muted: #9a9aa5; --accent: #4f8cff;
    --green: #3ecf6e; --red: #e05555; --gray: #6b6b75;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }  /* 避免 display 規則蓋掉 hidden 屬性 */
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Segoe UI", "Microsoft JhengHei", sans-serif; font-size: 14px;
    display: flex; flex-direction: column; height: 100vh;
  }
  header {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 16px; margin: 0 12px 0 0; color: var(--accent); }
  select, input, button {
    background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; font-size: 14px;
  }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { color: var(--red); }
  .spacer { flex: 1; }
  main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  #content { flex: 1; overflow-y: auto; padding: 16px; }
  .empty { color: var(--muted); text-align: center; margin-top: 60px; }

  /* 服務狀態列 */
  #services { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .svc {
    display: flex; align-items: center; gap: 8px;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 12px;
  }
  .light { width: 10px; height: 10px; border-radius: 50%; background: var(--gray); }
  .light.on { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .light.off { background: var(--red); }
  .svc small { color: var(--muted); }
  .svc-open { color: var(--accent); text-decoration: none; font-size: 12px; margin-left: 2px; }
  .svc-open:hover { text-decoration: underline; }
  .svc-open.dim { opacity: .45; }

  /* 動作按鈕 */
  .category { margin-bottom: 20px; }
  .category h2 {
    font-size: 13px; color: var(--muted); font-weight: normal;
    margin: 0 0 8px; border-bottom: 1px solid var(--border); padding-bottom: 4px;
  }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .action {
    display: flex; align-items: stretch;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    overflow: hidden;
  }
  .action > .run {
    border: none; border-radius: 0; background: none; padding: 10px 16px;
    font-size: 14px; text-align: left;
  }
  .action > .run:hover { background: rgba(79,140,255,.12); }
  .action > .run.running { color: var(--accent); }
  .action > .run:disabled { opacity: .35; cursor: not-allowed; }
  .action > .run:disabled:hover { background: none; }
  .action > .run .file { display: block; font-size: 11px; color: var(--muted); margin-top: 2px; }
  .action .mgmt { display: none; }
  body.manage .action .mgmt {
    display: flex; flex-direction: column; border-left: 1px solid var(--border);
  }
  .action .mgmt button { border: none; border-radius: 0; padding: 2px 8px; flex: 1; font-size: 12px; }
  .broken { opacity: .5; }
  .broken .run { text-decoration: line-through; }

  /* 輸出面板 */
  #output-panel {
    height: 260px; display: flex; flex-direction: column;
    border-top: 1px solid var(--border); background: #17181c;
  }
  #output-head {
    display: flex; align-items: center; gap: 10px;
    padding: 6px 12px; color: var(--muted); font-size: 12px;
    border-bottom: 1px solid var(--border);
  }
  #output {
    flex: 1; overflow-y: auto; margin: 0; padding: 8px 12px;
    font-family: Consolas, monospace; font-size: 13px; white-space: pre-wrap; word-break: break-all;
  }
  #output .err { color: var(--red); }
  #output .meta { color: var(--muted); }

  /* dialogs */
  dialog {
    background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px; padding: 20px; min-width: 420px;
  }
  #project-dialog { min-width: 560px; }
  dialog::backdrop { background: rgba(0,0,0,.5); }
  dialog h3 { margin: 0 0 14px; font-size: 15px; }
  dialog label { display: block; margin-bottom: 10px; color: var(--muted); font-size: 13px; }
  dialog label input, dialog label select { display: block; width: 100%; margin-top: 4px; }
  dialog .btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  #svc-table { width: 100%; border-collapse: collapse; margin-bottom: 8px; }
  #svc-table td { padding: 3px 4px; }
  #svc-table input { width: 100%; }
  fieldset { border: 1px solid var(--border); border-radius: 8px; margin: 14px 0 0; }
  fieldset legend { color: var(--muted); font-size: 13px; padding: 0 6px; }
</style>
</head>
<body>
<header>
  <h1>devdeck</h1>
  <select id="project-select"></select>
  <button id="btn-add-project" data-i18n="header.addProject">＋ 新增專案</button>
  <button id="btn-edit-project" class="mgmt-only" hidden data-i18n="header.editProject">編輯專案</button>
  <button id="btn-add-action" hidden data-i18n="header.addAction">＋ 新增動作</button>
  <span class="spacer"></span>
  <select id="lang-select" title="Language / 語言">
    <option value="zh-TW">中文</option>
    <option value="en">English</option>
  </select>
  <label style="color:var(--muted)"><input type="checkbox" id="manage-toggle"> <span data-i18n="header.manageMode">管理模式</span></label>
  <button id="btn-shutdown" data-i18n="header.shutdown" data-i18n-title="header.shutdownTitle" title="停止 devdeck 伺服器" class="danger">關閉工具</button>
</header>

<main>
  <div id="content">
    <div id="services"></div>
    <div id="action-list"></div>
    <div id="empty" class="empty" hidden></div>
  </div>
  <div id="output-panel">
    <div id="output-head"><span id="output-title">輸出</span><span class="spacer"></span>
      <button id="btn-clear-output" data-i18n="output.clear" style="font-size:12px;padding:2px 8px">清除</button></div>
    <pre id="output"></pre>
  </div>
</main>

<!-- 專案 dialog -->
<dialog id="project-dialog">
  <h3 id="project-dialog-title">新增專案</h3>
  <label><span data-i18n="proj.name">專案名稱</span> <input id="p-name" required></label>
  <label><span data-i18n="proj.path">專案路徑</span> <input id="p-path" placeholder="D:\git\web\myproject" required></label>
  <label><span data-i18n="proj.scriptsDir">腳本目錄（相對於專案路徑）</span><input id="p-scripts" value="scripts"></label>
  <label><span data-i18n="proj.venv">venv 路徑（相對於專案路徑）</span><input id="p-venv" value=".venv"></label>
  <fieldset id="svc-fieldset" hidden>
    <legend data-i18n="proj.svcLegend">服務（狀態監測）</legend>
    <table id="svc-table">
      <thead><tr>
        <td style="color:var(--muted)" data-i18n="proj.colName">名稱</td>
        <td style="color:var(--muted)" data-i18n="proj.colPort">port</td>
        <td style="color:var(--muted)" data-i18n="proj.colPid">PID 檔（選填）</td>
        <td style="color:var(--muted)" data-i18n="proj.colWeb" data-i18n-title="proj.colWebTitle" title="勾選後狀態列顯示「開啟」連結，開 http://localhost:port">開網頁</td><td></td>
      </tr></thead>
      <tbody id="svc-rows"></tbody>
    </table>
    <button id="btn-add-svc" data-i18n="proj.addSvc" style="font-size:12px">＋ 加入服務</button>
  </fieldset>
  <div class="btns">
    <button id="btn-del-project" class="danger" hidden data-i18n="proj.del">刪除專案</button>
    <span class="spacer"></span>
    <button onclick="document.getElementById('project-dialog').close()" data-i18n="common.cancel">取消</button>
    <button id="btn-save-project" class="primary" data-i18n="common.save">儲存</button>
  </div>
</dialog>

<!-- 動作 dialog -->
<dialog id="action-dialog">
  <h3 id="action-dialog-title">新增動作</h3>
  <div style="display:flex;gap:16px;margin-bottom:10px;color:var(--muted);font-size:13px">
    <span data-i18n="act.typeLabel">動作類型：</span>
    <label style="margin:0"><input type="radio" name="a-type" value="script" checked> <span data-i18n="act.typeScript">腳本檔案</span></label>
    <label style="margin:0"><input type="radio" name="a-type" value="command"> <span data-i18n="act.typeCommand">直接指令</span></label>
  </div>
  <label id="a-script-row"><span data-i18n="act.scriptRow">腳本檔案</span> <select id="a-script"></select></label>
  <label id="a-command-row" hidden><span data-i18n="act.commandRow">指令內容（於工作目錄以 shell 執行，專案 venv 已掛入 PATH）</span>
    <input id="a-command" placeholder="alembic upgrade head"></label>
  <label><span data-i18n="act.displayName">顯示名稱</span> <input id="a-label" required></label>
  <label><span data-i18n="act.category">分類（選填）</span><input id="a-category" list="category-list"><datalist id="category-list"></datalist></label>
  <fieldset style="margin:0 0 10px">
    <legend data-i18n="act.svcLegend">按鈕狀態關聯（勾選的條件「全部成立」時停用此按鈕）</legend>
    <div id="a-services"></div>
  </fieldset>
  <label><span data-i18n="act.workdir">工作目錄（選填，預設為專案路徑）</span><input id="a-workdir"></label>
  <label><span data-i18n="act.sort">排序（數字小的在前）</span><input id="a-sort" type="number" value="0"></label>
  <div class="btns">
    <button id="btn-del-action" class="danger" hidden data-i18n="act.del">刪除動作</button>
    <span class="spacer"></span>
    <button onclick="document.getElementById('action-dialog').close()" data-i18n="common.cancel">取消</button>
    <button id="btn-save-action" class="primary" data-i18n="common.save">儲存</button>
  </div>
</dialog>

let LANG = DEFAULT_LANG;

function detectLang() {
  const saved = localStorage.getItem("devdeck.lang");
  if (saved && I18N[saved]) return saved;
  const nav = ((navigator.languages && navigator.languages[0]) || navigator.language || "").toLowerCase();
  if (nav.startsWith("en")) return "en";
  if (nav.startsWith("zh")) return "zh-TW";
  return DEFAULT_LANG;
}

function t(key, vars) {
  const table = I18N[LANG] || I18N[DEFAULT_LANG];
  let s = table[key] != null ? table[key]
        : (I18N[DEFAULT_LANG][key] != null ? I18N[DEFAULT_LANG][key] : key);
  if (vars) s = s.replace(/\{(\w+)\}/g, (m, k) => (vars[k] != null ? vars[k] : m));
  return s;
}

function applyStaticI18n(root = document) {
  root.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  root.querySelectorAll("[data-i18n-title]").forEach(el => { el.title = t(el.dataset.i18nTitle); });
  root.querySelectorAll("[data-i18n-placeholder]").forEach(el => { el.placeholder = t(el.dataset.i18nPlaceholder); });
}

function renderOutputTitle() {
  $("output-title").textContent = state.outputLabel
    ? t("output.titleWith", { label: state.outputLabel })
    : t("output.title");
}

// 切換語系：立即生效、記憶到 localStorage、同步 <html lang>，並重繪動態 render 的區塊
function setLang(lang) {
  LANG = I18N[lang] ? lang : DEFAULT_LANG;
  localStorage.setItem("devdeck.lang", LANG);
  document.documentElement.lang = LANG === "en" ? "en" : "zh-Hant";
  const ls = $("lang-select");
  if (ls) ls.value = LANG;
  applyStaticI18n();
  renderOutputTitle();
  renderProjectSelect();
  if (state.projectId) { renderActions(); refreshStatus(); }
  else { $("empty").textContent = t("empty.noProject"); }
}

// token 由啟動腳本帶在 ?token=，收下存 localStorage 後立刻從網址列清掉
{
  const urlToken = new URLSearchParams(location.search).get("token");
  if (urlToken) {
    localStorage.setItem("devdeck.token", urlToken);
    history.replaceState(null, "", location.pathname);
  }
}
const TOKEN = () => localStorage.getItem("devdeck.token") || "";

function authLost() {
  clearInterval(state.statusTimer);
  document.body.innerHTML = `<div class="empty" style="margin-top:80px">
    ${t("auth.lost")}<br>
    <small>${t("auth.lostHint")}</small></div>`;
}
const state = {
  projects: [], projectId: null, services: [], actions: [], scan: [],
  status: new Map(),  // service_id -> listening(bool)
  editingActionId: null, editingProject: false, statusTimer: null, runAbort: null,
  outputLabel: null,  // 目前輸出面板顯示的動作名稱（供語系切換時重繪標題）
};

async function api(method, url, body) {
  const res = await fetch(url, {
    method,
    headers: {
      "X-Devdeck-Token": TOKEN(),
      ...(body ? { "Content-Type": "application/json" } : {}),
    },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (res.status === 401) { authLost(); throw new Error("unauthorized"); }
  if (!res.ok) {
    let msg = res.statusText;
    // detail 可能是 error key 物件（{key, params}）或純字串（相容協定層訊息）
    try {
      const detail = (await res.json()).detail;
      if (detail && typeof detail === "object" && detail.key) msg = t(detail.key, detail.params);
      else if (detail) msg = detail;
    } catch {}
    throw new Error(msg);
  }
  return res.json();
}
const toast = msg => alert(msg);

/* ---------- 專案 ---------- */

async function loadProjects(selectId) {
  state.projects = await api("GET", "/api/projects");
  renderProjectSelect();
  const remembered = selectId ?? Number(localStorage.getItem("devdeck.project"));
  const target = state.projects.find(p => p.id === remembered) || state.projects[0];
  await selectProject(target ? target.id : null);
}

function renderProjectSelect() {
  const sel = $("project-select");
  sel.innerHTML = "";
  for (const p of state.projects) {
    const opt = document.createElement("option");
    opt.value = p.id; opt.textContent = p.name;
    sel.appendChild(opt);
  }
  if (!state.projects.length) {
    const opt = document.createElement("option");
    opt.textContent = t("empty.noProjectOption");
    opt.disabled = true; opt.selected = true;
    sel.appendChild(opt);
  }
  if (state.projectId != null) sel.value = state.projectId;
}

async function selectProject(id) {
  state.projectId = id;
  $("btn-add-action").hidden = !id;
  $("btn-edit-project").hidden = !id;
  if (!id) {
    $("services").innerHTML = ""; $("action-list").innerHTML = "";
    $("empty").hidden = false;
    $("empty").textContent = t("empty.noProject");
    return;
  }
  localStorage.setItem("devdeck.project", id);
  $("project-select").value = id;
  [state.services, state.actions] = await Promise.all([
    api("GET", `/api/projects/${id}/services`),
    api("GET", `/api/projects/${id}/actions`),
  ]);
  renderActions();
  refreshStatus();
}

function currentProject() {
  return state.projects.find(p => p.id === state.projectId);
}

/* ---------- 服務狀態 ---------- */

async function refreshStatus() {
  if (!state.projectId) return;
  let list;
  try { list = await api("GET", `/api/projects/${state.projectId}/status`); }
  catch { return; }
  state.status = new Map(list.map(s => [s.id, s.listening]));
  applyButtonStates();
  const box = $("services");
  box.innerHTML = "";
  for (const s of list) {
    const div = document.createElement("div");
    div.className = "svc";
    const light = s.listening ? "on" : "off";
    let extra = s.listening ? t("svc.running") : t("svc.stopped");
    if (s.pid != null) extra += s.pid_alive ? t("svc.pid", { pid: s.pid }) : t("svc.pidStale");
    const open = s.url
      ? `<a class="svc-open ${s.listening ? "" : "dim"}" href="${esc(s.url)}" target="_blank">${t("svc.open")}</a>`
      : "";
    div.innerHTML = `<span class="light ${light}"></span><b>${esc(s.name)}</b>
      <small>:${s.port} ${esc(extra)}</small>${open}`;
    box.appendChild(div);
  }
}

function applyButtonStates() {
  // 勾選的條件「全部成立」時停用按鈕；沒有關聯或狀態未知則不停用
  for (const a of state.actions) {
    const btn = document.querySelector(`button.run[data-id="${a.id}"]`);
    if (!btn) continue;
    const links = a.services || [];
    let disabled = false;
    if (links.length && links.every(l => state.status.has(l.service_id))) {
      disabled = links.every(
        l => (l.disable_when === "running") === state.status.get(l.service_id));
    }
    btn.disabled = disabled;
  }
}

function startStatusPolling() {
  clearInterval(state.statusTimer);
  state.statusTimer = setInterval(refreshStatus, 3000);
}

/* ---------- 動作清單 ---------- */

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g,
    c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function renderActions() {
  const box = $("action-list");
  box.innerHTML = "";
  $("empty").hidden = state.actions.length > 0;
  if (!state.actions.length) {
    $("empty").textContent = t("empty.noAction");
    return;
  }
  const groups = new Map();
  for (const a of state.actions) {
    const key = a.category || t("cat.uncategorized");
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(a);
  }
  for (const [cat, items] of groups) {
    const div = document.createElement("div");
    div.className = "category";
    div.innerHTML = `<h2>${esc(cat)}</h2>`;
    const row = document.createElement("div");
    row.className = "actions";
    for (const a of items) {
      const card = document.createElement("div");
      card.className = "action";
      card.innerHTML = `
        <button class="run" data-id="${a.id}">${esc(a.label)}
          <span class="file">${esc(a.script_file || "$ " + (a.command || ""))}</span></button>
        <span class="mgmt">
          <button class="edit" data-id="${a.id}">${t("common.edit")}</button>
        </span>`;
      row.appendChild(card);
    }
    div.appendChild(row);
    box.appendChild(div);
  }
  applyButtonStates();
}

/* ---------- 執行（SSE）---------- */

function appendOutput(text, cls) {
  const out = $("output");
  const span = document.createElement("span");
  if (cls) span.className = cls;
  span.textContent = text + "\n";
  out.appendChild(span);
  out.scrollTop = out.scrollHeight;
}

function handleRunEvent(block) {
  let event = "message", data = "";
  for (const line of block.split("\n")) {
    if (line.startsWith("event:")) event = line.slice(6).trim();
    else if (line.startsWith("data:")) data += line.slice(5).trim();
  }
  if (!data) return;
  const d = JSON.parse(data);
  if (event === "start") {
    appendOutput(`$ ${d.cmd.join(" ")}`, "meta");
    appendOutput(`  (cwd: ${d.cwd})`, "meta");
  } else if (event === "line") {
    appendOutput(d);
  } else if (event === "done") {
    appendOutput(t("run.done", { code: d.exit_code }), d.exit_code === 0 ? "meta" : "err");
  } else if (event === "error") {
    // 後端回 error key（{key, params}）；由前端依語系組訊息。舊格式（純字串）仍相容。
    appendOutput(typeof d === "string" ? d : t(d.key, d.params), "err");
  }
}

async function runAction(id, btn) {
  // 用 fetch POST 讀 SSE（不用 EventSource：它只能 GET，而 GET 端點擋不住跨站觸發）
  if (state.runAbort) state.runAbort.abort();
  document.querySelectorAll(".run.running").forEach(b => b.classList.remove("running"));
  btn.classList.add("running");
  const label = btn.childNodes[0].textContent.trim();
  state.outputLabel = label;
  renderOutputTitle();
  $("output").innerHTML = "";
  const ctrl = new AbortController();
  state.runAbort = ctrl;
  try {
    const res = await fetch(`/api/actions/${id}/run`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Devdeck-Token": TOKEN() },
      body: "{}", signal: ctrl.signal,
    });
    if (res.status === 401) { authLost(); return; }
    if (!res.ok) {
      appendOutput(`HTTP ${res.status}`, "err");
    } else {
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buf = "";
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        let idx;
        while ((idx = buf.indexOf("\n\n")) >= 0) {
          handleRunEvent(buf.slice(0, idx));
          buf = buf.slice(idx + 2);
        }
      }
    }
  } catch (e) {
    if (e.name !== "AbortError") appendOutput(t("run.aborted", { msg: e.message }), "err");
  }
  if (state.runAbort === ctrl) state.runAbort = null;
  btn.classList.remove("running");
  refreshStatus();
}

/* ---------- 專案 dialog ---------- */

function svcRow(s = {}) {
  const tr = document.createElement("tr");
  tr.dataset.id = s.id || "";
  tr.innerHTML = `
    <td><input class="s-name" value="${esc(s.name || "")}" placeholder="fastapi"></td>
    <td><input class="s-port" type="number" value="${s.port ?? ""}" placeholder="8000" style="width:80px"></td>
    <td><input class="s-pid" value="${esc(s.pid_file || "")}" placeholder="uvicorn.pid"></td>
    <td style="text-align:center"><input type="checkbox" class="s-web" ${s.url ? "checked" : ""}></td>
    <td><button class="danger s-del" style="font-size:12px">${t("common.delete")}</button></td>`;
  tr.querySelector(".s-del").onclick = async () => {
    if (s.id) {
      if (!confirm(t("confirm.delSvc", { name: s.name }))) return;
      await api("DELETE", `/api/services/${s.id}`);
    }
    tr.remove();
  };
  return tr;
}

function openProjectDialog(editing) {
  state.editingProject = editing;
  const p = editing ? currentProject() : null;
  $("project-dialog-title").textContent = t(editing ? "proj.editTitle" : "proj.addTitle");
  $("p-name").value = p ? p.name : "";
  $("p-path").value = p ? p.path : "";
  $("p-scripts").value = p ? p.scripts_dir : "scripts";
  $("p-venv").value = p ? p.venv_path : ".venv";
  $("btn-del-project").hidden = !editing;
  $("svc-fieldset").hidden = !editing;
  if (editing) {
    const tbody = $("svc-rows");
    tbody.innerHTML = "";
    for (const s of state.services) tbody.appendChild(svcRow(s));
  }
  $("project-dialog").showModal();
}

async function saveProject() {
  const body = {
    name: $("p-name").value.trim(),
    path: $("p-path").value.trim(),
    scripts_dir: $("p-scripts").value.trim() || "scripts",
    venv_path: $("p-venv").value.trim() || ".venv",
  };
  if (!body.name || !body.path) return toast(t("toast.nameReq"));
  try {
    let id = state.projectId;
    if (state.editingProject) {
      await api("PUT", `/api/projects/${id}`, body);
      for (const tr of $("svc-rows").children) {
        const svc = {
          name: tr.querySelector(".s-name").value.trim(),
          port: Number(tr.querySelector(".s-port").value),
          pid_file: tr.querySelector(".s-pid").value.trim() || null,
        };
        svc.url = tr.querySelector(".s-web").checked && svc.port
          ? `http://localhost:${svc.port}` : null;
        if (!svc.name || !svc.port) continue;
        if (tr.dataset.id) await api("PUT", `/api/services/${tr.dataset.id}`, svc);
        else await api("POST", `/api/projects/${id}/services`, svc);
      }
    } else {
      id = (await api("POST", "/api/projects", body)).id;
    }
    $("project-dialog").close();
    await loadProjects(id);
    if (!state.editingProject) {
      // 新專案：直接再開編輯模式讓使用者補服務設定
      openProjectDialog(true);
    }
  } catch (e) { toast(e.message); }
}

/* ---------- 動作 dialog ---------- */

async function openActionDialog(actionId) {
  state.editingActionId = actionId;
  const a = actionId ? state.actions.find(x => x.id === actionId) : null;
  $("action-dialog-title").textContent = t(a ? "act.editTitle" : "act.addTitle");
  try { state.scan = await api("GET", `/api/projects/${state.projectId}/scan`); }
  catch { state.scan = []; }  // 掃描失敗（如腳本目錄不存在）仍可新增「直接指令」

  const sel = $("a-script");
  sel.innerHTML = "";
  for (const s of state.scan) {
    if (s.added && (!a || s.file !== a.script_file)) continue;  // 已新增的不重複列出
    const opt = document.createElement("option");
    opt.value = s.file; opt.textContent = s.file;
    sel.appendChild(opt);
  }
  if (!sel.options.length) {
    const opt = document.createElement("option");
    opt.value = ""; opt.textContent = t("act.noScript");
    sel.appendChild(opt);
  }

  const box = $("a-services");
  box.innerHTML = state.services.length
    ? "" : `<small style="color:var(--muted)">${t("act.noServices")}</small>`;
  for (const s of state.services) {
    const link = a?.services?.find(x => x.service_id === s.id);
    const running = state.status.get(s.id);
    const row = document.createElement("label");
    row.style.cssText = "display:flex;align-items:center;gap:8px;margin:6px 0";
    row.innerHTML = `
      <input type="checkbox" class="l-check" data-id="${s.id}" ${link ? "checked" : ""}>
      <span class="light ${running === true ? "on" : running === false ? "off" : ""}"></span>
      <span style="min-width:110px;color:var(--text)">${esc(s.name)} (:${s.port})</span>
      <select class="l-when">
        <option value="running">${t("act.whenRunning")}</option>
        <option value="stopped">${t("act.whenStopped")}</option>
      </select>`;
    row.querySelector(".l-when").value = link?.disable_when || "running";
    box.appendChild(row);
  }

  const dl = $("category-list");
  dl.innerHTML = "";
  for (const c of new Set(state.actions.map(x => x.category).filter(Boolean))) {
    const opt = document.createElement("option");
    opt.value = c;
    dl.appendChild(opt);
  }

  sel.value = a?.script_file || sel.options[0].value;
  setActionType(a?.command ? "command" : "script");
  $("a-command").value = a?.command || "";
  $("a-label").value = a ? a.label : "";
  $("a-category").value = a?.category || "";
  $("a-workdir").value = a?.workdir || "";
  $("a-workdir").placeholder = currentProject()?.path || "";
  $("a-sort").value = a?.sort_order ?? 0;
  $("btn-del-action").hidden = !a;
  $("action-dialog").showModal();
}

function setActionType(t) {
  document.querySelector(`input[name="a-type"][value="${t}"]`).checked = true;
  $("a-script-row").hidden = t !== "script";
  $("a-command-row").hidden = t !== "command";
}
document.querySelectorAll('input[name="a-type"]').forEach(r => {
  r.onchange = () => setActionType(r.value);
});

async function saveAction() {
  const type = document.querySelector('input[name="a-type"]:checked').value;
  const body = {
    script_file: type === "script" ? ($("a-script").value || null) : null,
    command: type === "command" ? ($("a-command").value.trim() || null) : null,
    label: $("a-label").value.trim(),
    category: $("a-category").value.trim() || null,
    services: [...document.querySelectorAll("#a-services .l-check:checked")].map(ch => ({
      service_id: Number(ch.dataset.id),
      disable_when: ch.closest("label").querySelector(".l-when").value,
    })),
    workdir: $("a-workdir").value.trim() || null,
    sort_order: Number($("a-sort").value) || 0,
  };
  if (!body.label) return toast(t("toast.labelReq"));
  if (type === "script" && !body.script_file) return toast(t("toast.scriptReq"));
  if (type === "command" && !body.command) return toast(t("toast.commandReq"));
  try {
    if (state.editingActionId) await api("PUT", `/api/actions/${state.editingActionId}`, body);
    else await api("POST", `/api/projects/${state.projectId}/actions`, body);
    $("action-dialog").close();
    await selectProject(state.projectId);
  } catch (e) { toast(e.message); }
}

/* ---------- 事件繫結 ---------- */

$("project-select").onchange = e => selectProject(Number(e.target.value));
$("btn-add-project").onclick = () => openProjectDialog(false);
$("btn-edit-project").onclick = () => openProjectDialog(true);
$("btn-save-project").onclick = saveProject;
$("btn-del-project").onclick = async () => {
  const p = currentProject();
  if (!confirm(t("confirm.delProject", { name: p.name }))) return;
  await api("DELETE", `/api/projects/${p.id}`);
  $("project-dialog").close();
  await loadProjects();
};
$("btn-add-svc").onclick = e => { e.preventDefault(); $("svc-rows").appendChild(svcRow()); };
$("btn-add-action").onclick = () => openActionDialog(null);
$("btn-save-action").onclick = saveAction;
$("btn-del-action").onclick = async () => {
  const a = state.actions.find(x => x.id === state.editingActionId);
  if (!confirm(t("confirm.delAction", { label: a.label }))) return;
  await api("DELETE", `/api/actions/${a.id}`);
  $("action-dialog").close();
  await selectProject(state.projectId);
};
$("manage-toggle").onchange = e => document.body.classList.toggle("manage", e.target.checked);
$("btn-shutdown").onclick = async () => {
  if (!confirm(t("confirm.shutdown"))) return;
  clearInterval(state.statusTimer);
  try { await api("POST", "/api/shutdown"); } catch {}
  document.body.innerHTML =
    `<div class="empty" style="margin-top:80px">${t("shutdown.done")}</div>`;
};
$("btn-clear-output").onclick = () => { $("output").innerHTML = ""; state.outputLabel = null; renderOutputTitle(); };
$("lang-select").onchange = e => setLang(e.target.value);
$("action-list").addEventListener("click", e => {
  const runBtn = e.target.closest("button.run");
  if (runBtn) return runAction(Number(runBtn.dataset.id), runBtn);
  const editBtn = e.target.closest("button.edit");
  if (editBtn) return openActionDialog(Number(editBtn.dataset.id));
});

setLang(detectLang());
loadProjects();
startStatusPolling();
</script>
</body>
</html>
